<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photography, Ireti Cole</title>
  <meta name="description" content="Fashion, portrait, wedding and concert photography by Ireti Cole." />
  <meta name="theme-color" content="#07080a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307080a'/%3E%3Crect x='3' y='15' width='26' height='2' fill='%237cc4ff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=panchang@800&f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
  <script>try{if(sessionStorage.getItem("wipe")){sessionStorage.removeItem("wipe");document.documentElement.classList.add("is-entering")}}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body data-page="photography">
  <a class="skip" href="#main">Skip to content</a>
  <div data-head></div>

  <main id="main">
    <header class="page-head">
      <h1 class="display h1" data-desq data-now>Photography</h1>
      <div class="page-head__row">
        <p class="muted" style="margin:0;max-width:44ch">Stills from campaigns, stages, weddings and portrait sessions. Select any photograph to see it large.</p>
        <div class="filters" role="group" aria-label="Filter photographs" data-photo-filters></div>
      </div>
    </header>
    <div class="slit lbx" data-letterbox data-now><video src="media/v/before-the-walk.mp4" muted loop playsinline autoplay preload="auto" data-autoplay aria-hidden="true"></video></div>
    <div style="height:clamp(48px,8vh,96px)"></div>
    <div class="masonry" data-masonry></div>
    <div data-close></div>
  </main>
  <dialog class="viewer" data-lightbox aria-label="Photograph">
    <button class="viewer__close" type="button" data-close>Close</button>
    <button class="viewer__step viewer__step--prev" type="button" data-prev>Previous</button>
    <img alt="" src="media/p/white-dress.jpg" />
    <button class="viewer__step viewer__step--next" type="button" data-next>Next</button>
    <p class="viewer__cap"></p>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="content.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/photos.js"></script>
</body>
</html>
