<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book a shoot, Ireti Cole</title>
  <meta name="description" content="Book a shoot with Ireti Cole." />
  <meta name="theme-color" content="#07080a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307080a'/%3E%3Crect x='3' y='15' width='26' height='2' fill='%237cc4ff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=panchang@800&f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
  <script>try{if(sessionStorage.getItem("wipe")){sessionStorage.removeItem("wipe");document.documentElement.classList.add("is-entering")}}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/site.css" />
</head>
<body data-page="contact">
  <a class="skip" href="#main">Skip to content</a>
  <div data-head></div>

  <main id="main">
    <section class="contact">
      <div class="contact__intro">
        <h1 class="display h1" data-desq data-now>Book a<br />shoot</h1>
        <p class="lede" style="font-size:clamp(1.15rem,1.7vw,1.5rem)">Tell me what you are making and when. I reply within two working days.</p>
        <div class="contact__lines" data-contact-lines></div>
      </div>
      <form class="form" data-form novalidate>
        <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" autocomplete="name" required /><p class="field__err" id="e-name"></p></div>
        <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required /><p class="field__err" id="e-email"></p></div>
        <div class="field"><label for="f-kind">Kind of shoot</label>
          <select id="f-kind" name="kind" required><option value="">Choose one</option><option>Brand film or ad</option><option>Music video or concert</option><option>Wedding or event</option><option>Fashion or portrait</option><option>Something else</option></select><p class="field__err" id="e-kind"></p></div>
        <div class="field"><label for="f-date">Shoot date <small>(if you know it)</small></label><input id="f-date" name="date" type="date" /><p class="field__err"></p></div>
        <div class="field field--full"><label for="f-budget">Budget <small>(rough is fine)</small></label>
          <select id="f-budget" name="budget"><option value="">Not sure yet</option><option>Under 2,000</option><option>2,000 to 5,000</option><option>5,000 to 15,000</option><option>15,000 or more</option></select></div>
        <div class="field field--full"><label for="f-msg">About the project</label><textarea id="f-msg" name="message" required placeholder="What it is, where, and anything I should know"></textarea><p class="field__err" id="e-msg"></p></div>
        <div class="form__foot"><button class="btn btn--flare btn--lg" type="submit">Send enquiry</button><p class="form__note">This opens your email app with the details filled in.</p></div>
        <div class="form__done" role="status" data-done><h2 class="display h3">Thank you</h2><p>Your email app should open with the enquiry ready to send. If it did not, write to the address on the left.</p></div>
      </form>
    </section>
    <div class="slit lbx" style="margin-top:clamp(64px,10vh,120px)" data-letterbox><video src="media/v/salt-flats.mp4" muted loop playsinline preload="none" data-autoplay aria-hidden="true"></video></div>
    <div data-close></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="content.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/contact.js"></script>
</body>
</html>
